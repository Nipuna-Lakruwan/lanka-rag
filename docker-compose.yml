# docker compose up -d ollama
# docker compose exec ollama ollama pull bge-m3
# docker compose run --rm app ingest /docs
# docker compose run --rm app ask "ශ්‍රී ලංකාවේ අගනුවර කුමක්ද?"
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  app:
    build: .
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./docs:/docs:ro
      - ./.index:/app/.index
      - ./results:/app/results
      - ./data:/app/data
      - ./.cache:/app/.cache

volumes:
  ollama:

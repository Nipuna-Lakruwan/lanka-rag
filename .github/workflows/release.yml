name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the package and uploads it to PyPI.
# Uses PyPI trusted publishing (OIDC), so no API token is stored in the repo.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/lanka_rag/__init__.py').read_text())[1])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != package version v$version"; exit 1; }
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/lanka-rag/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

[project]
name = "lanka-rag"
version = "0.1.0"
description = "Local-first Sinhala/Tamil RAG with Ollama + LangChain, and a retrieval benchmark of embedding models on Sinhala, Tamil and Singlish."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nipuna Lakruwan" }]
keywords = [
    "sinhala", "tamil", "singlish", "sri-lanka", "rag", "retrieval", "embeddings",
    "benchmark", "ollama", "langchain", "multilingual", "nlp", "low-resource-languages",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Tamil",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langchain-text-splitters>=1.0",
    "pypdf>=5.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/Nipuna-Lakruwan/lanka-rag"
Results = "https://github.com/Nipuna-Lakruwan/lanka-rag/blob/main/results/results.md"
Issues = "https://github.com/Nipuna-Lakruwan/lanka-rag/issues"

[project.optional-dependencies]
# Hugging Face models (multilingual-e5, LaBSE, ...) that are not on Ollama.
hf = ["sentence-transformers>=3.0"]

[project.scripts]
lanka-rag = "lanka_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lanka_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures hold long Sinhala/Tamil sample sentences.
"tests/*" = ["E501"]
